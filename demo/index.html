<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Viet Tu Vi Engine</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17202a;font:14px system-ui,sans-serif}
    header{height:56px;background:#17202a;color:#fff;display:flex;align-items:center;padding:0 24px;font-size:18px;font-weight:650}
    main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px)}
    aside{background:#fff;border-right:1px solid #d5d9df;padding:20px}form{display:grid;gap:15px}
    label{display:grid;gap:6px;color:#46515c;font-size:12px;font-weight:600}input,select{height:38px;border:1px solid #aeb6bf;border-radius:4px;padding:0 10px;background:#fff;color:#17202a;font:inherit}
    .check{display:flex;align-items:center;gap:8px}.check input{width:16px;height:16px}
    button{height:40px;border:0;border-radius:4px;background:#1261a0;color:#fff;font-weight:650;cursor:pointer;padding:0 14px}button:hover{background:#0d4f84}
    button.secondary{height:34px;background:#fff;color:#25313d;border:1px solid #aeb6bf}button.secondary:hover{background:#eef1f4}
    section{padding:20px;min-width:0}.summary{display:flex;gap:20px;align-items:baseline;margin-bottom:14px}.summary h1{font-size:19px;margin:0}.muted{color:#66717c}
    #chart{background:#fff;border:1px solid #d5d9df;max-width:820px}#chart svg{display:block;width:100%;height:auto}
    .warning{max-width:820px;margin:10px 0;padding:9px 12px;border-left:3px solid #b36b00;background:#fff7e8}
    details{max-width:820px;margin-top:14px}pre{overflow:auto;background:#17202a;color:#e8edf2;padding:14px;border-radius:4px;font-size:11px}
    @media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #d5d9df}section{padding:14px}}
  </style>
</head>
<body>
  <header>Viet Tu Vi Engine</header>
  <main>
    <aside>
      <form id="form">
        <label>Ngày giờ sinh<input id="datetime" type="datetime-local" value="1990-05-17T14:30" required></label>
        <label>Giới tính<select id="gender"><option value="female">Nữ</option><option value="male">Nam</option></select></label>
        <label>Thành phố<select id="city"></select></label>
        <label>Năm xem hạn<input id="year" type="number" min="1" max="9999" value="2026"></label>
        <label>Ngày xem chi tiết<input id="asof" type="date" value="2026-07-26"></label>
        <label class="check"><input id="solar" type="checkbox" checked> Hiệu chỉnh giờ Mặt Trời thật</label>
        <label class="check"><input id="phihoa" type="checkbox"> Bao gồm Phi Hóa</label>
        <button type="submit">Lập lá số</button>
      </form>
    </aside>
    <section>
      <div class="summary"><h1 id="cuc">Lá số</h1><span class="muted" id="meta"></span></div>
      <div class="summary" aria-label="Xuất kết quả">
        <button class="secondary" id="download-svg" type="button" title="Tải lá số SVG">Tải SVG</button>
        <button class="secondary" id="download-json" type="button" title="Tải structured JSON">Tải JSON</button>
        <button class="secondary" id="copy-json" type="button" title="Sao chép structured JSON">Sao chép JSON</button>
      </div>
      <div id="warnings"></div>
      <div id="chart" aria-live="polite"></div>
      <details><summary>Structured JSON</summary><pre id="json"></pre></details>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
