[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viet-tuvi-engine"
version = "0.1.0"
description = "Python binding for the deterministic viet-tuvi-engine TypeScript core"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
viet_tuvi_engine = ["_js/*.js", "_js/*.json", "_js/stars/*.js"]
