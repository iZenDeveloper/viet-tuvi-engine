name: Expert or oracle fixture
description: Submit reproducible expected values for a named Tử Vi tradition or calculator.
title: "[Fixture]: "
labels:
  - enhancement
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        A submission is evidence, not an automatic rule change. Do not include private personal data or copyrighted interpretive prose.
  - type: dropdown
    id: profile
    attributes:
      label: Tradition profile
      options:
        - Vietnamese popular
        - Trung Châu
        - Custom or other named school
    validations:
      required: true
  - type: dropdown
    id: evidence_class
    attributes:
      label: Evidence class
      options:
        - Expert-approved oracle
        - Primary source with page or scan
        - Public calculator comparison oracle
        - Research observation only
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Calculation input
      description: Include local Gregorian time, timezone, gender, location/longitude, and observed lunar date.
      render: json
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: School and calculator settings
      description: List every option affecting Mệnh/Thân, Cục, Tứ Hóa, Hỏa/Linh, leap months, true solar time, and timelines.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Observed expected values
      description: Include only values directly observed or reviewed, using palace and star codes when possible.
      render: json
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance
      description: Give expert role, source title/edition/page, URL, calculator name/version, and capture or review date.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Known conflicts or scope limits
      description: Identify any fields not reviewed, uncertain conventions, or disagreement with another source.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Submission confirmation
      options:
        - label: I have permission to share and redistribute these minimal structured values under the repository license.
          required: true
        - label: This submission contains no personal identifiers or private interpretive report.
          required: true
        - label: I understand that AI-generated claims remain research evidence until independently verified.
          required: true
